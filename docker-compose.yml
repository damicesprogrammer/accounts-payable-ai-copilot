services:
  db:
    # Imagem com pgvector; a extensão é ativada pela migration 0003 (RAG).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ap_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ap_copilot}
      POSTGRES_DB: ${POSTGRES_DB:-ap_copilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ap_copilot}:${POSTGRES_PASSWORD:-ap_copilot}@db:5432/${POSTGRES_DB:-ap_copilot}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ap_copilot}:${POSTGRES_PASSWORD:-ap_copilot}@db:5432/ap_copilot_test
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # IA (opcional): defina no arquivo .env da raiz; nunca versionar a chave.
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Código montado para desenvolvimento com reload
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      # URL da API vista pelo navegador (não pelo container). Sem segredos aqui.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      # Hot reload: volumes montados do Windows/macOS não propagam eventos de arquivo.
      CHOKIDAR_USEPOLLING: "true"
    ports:
      # Porta fixa: é a origem liberada no CORS da API.
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Mantém o node_modules da imagem (Linux), sem herdar o do host.
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
